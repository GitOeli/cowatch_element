<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Watch together</title>
<style>
  :root { --bg:#ffffff; --surface:#f3f4f7; --fg:#16181d; --muted:#6a6f7c; --line:#dfe2e8;
          --accent:#0b7a5b; --accent-fg:#ffffff; --dot-idle:#b4b8c2; --dot-ok:#1fa971; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14161a; --surface:#1d2025; --fg:#eceef2; --muted:#9aa0ad; --line:#2a2e35;
            --accent:#3ecf9e; --accent-fg:#0c1f18; --dot-idle:#5a6070; --dot-ok:#3ecf9e; }
  }
  * { box-sizing: border-box; }
  html, body { height:100%; margin:0; }
  body { display:flex; flex-direction:column; background:var(--bg); color:var(--fg);
         font:15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display:flex; align-items:center; justify-content:space-between; gap:12px;
           padding:10px 14px; }
  .brand { display:flex; align-items:center; gap:10px; font-weight:650; letter-spacing:.01em; }
  .logo { display:inline-grid; place-items:center; width:26px; height:26px; border-radius:8px;
          background:var(--accent); color:var(--accent-fg); font-size:11px; padding-left:2px; }
  .ver { padding:2px 8px; border-radius:999px; background:var(--surface); color:var(--muted);
         font-size:11px; font-weight:500; font-variant-numeric:tabular-nums; }
  #status { display:flex; align-items:center; gap:8px; padding:5px 12px; border-radius:999px;
            background:var(--surface); color:var(--muted); font-size:13px; min-width:0; }
  #statusText { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .dot { flex:none; width:8px; height:8px; border-radius:50%; background:var(--dot-idle); }
  #status.live .dot { background:var(--dot-ok); box-shadow:0 0 0 3px color-mix(in srgb, var(--dot-ok) 25%, transparent); }
  form { display:flex; gap:8px; padding:0 14px 12px; }
  input { flex:1; min-width:0; padding:10px 16px; border:1px solid var(--line); border-radius:999px;
          background:var(--surface); color:var(--fg); font:inherit; }
  input::placeholder { color:var(--muted); }
  button { padding:10px 18px; border:0; border-radius:999px; background:var(--accent);
           color:var(--accent-fg); font:inherit; font-weight:650; cursor:pointer; white-space:nowrap; }
  button:hover { filter:brightness(1.08); }
  button:focus-visible, input:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  #stage { position:relative; flex:1; min-height:0; margin:0 14px 14px; border-radius:14px;
           overflow:hidden; background:#000; }
  #player { position:absolute; inset:0; width:100%; height:100%; border:0; }
  #empty { position:absolute; inset:0; z-index:1; display:flex; flex-direction:column;
           align-items:center; justify-content:center; gap:6px; text-align:center; padding:24px;
           background:var(--surface); color:var(--muted); pointer-events:none; }
  #empty[hidden], #join[hidden] { display:none; }
  #empty strong { color:var(--fg); font-size:17px; }
  #skip { position:absolute; bottom:14px; left:50%; transform:translateX(-50%); z-index:3;
          background:var(--surface); color:var(--fg); border:1px solid var(--line); }
  #join { position:absolute; inset:0; z-index:2; display:flex; align-items:center;
          justify-content:center; background:rgba(8,10,12,.78); backdrop-filter:blur(4px); }
  #join button { padding:14px 26px; font-size:16px; }
</style>
</head>
<body>
<header>
  <div class="brand"><span class="logo" aria-hidden="true">&#9654;</span><span>Watch together</span><span class="ver" id="ver" title="Widget version"></span></div>
  <div id="status" role="status"><span class="dot"></span><span id="statusText">Starting&hellip;</span></div>
</header>
<form id="load">
  <input id="url" type="url" placeholder="Paste a YouTube link" aria-label="YouTube link" required>
  <button type="submit">Play for everyone</button>
</form>
<div id="stage">
  <div id="empty"><strong>Nothing playing yet</strong><span>Paste a YouTube link above to start for the whole room.</span></div>
  <div id="player"></div>
  <button id="skip" type="button" hidden>Start anyway</button>
  <div id="join"><button id="joinBtn" type="button">Join the watch party</button></div>
</div>
<script>
(function () {
  'use strict';

  var VERSION = '1.4 (lockstep: everyone waits for ads, 2026-11-14)';
  document.getElementById('ver').textContent = 'v' + VERSION.split(' ')[0];
  document.getElementById('ver').title = 'Widget version ' + VERSION;
  var EVENT_TYPE = 'io.cowatch.sync';
  var DRIFT_LIMIT = 1.5;       // seconds before we correct a client
  var HEARTBEAT_MS = 5000;     // leader re-broadcasts position this often
  var me = Math.random().toString(36).slice(2);

  var params = new URLSearchParams(location.search);
  var widgetId = params.get('widgetId');
  var parentOrigin = '*';
  try { parentOrigin = new URL(params.get('parentUrl')).origin; } catch (e) {}

  var $status = document.getElementById('statusText');
  var $statusBox = document.getElementById('status');
  var $empty = document.getElementById('empty');
  var $join = document.getElementById('join');
  var $skip = document.getElementById('skip');
  function say(t) {
    $status.textContent = t;
    $statusBox.classList.toggle('live', /^(Playing|Paused|Connected)/.test(t));
  }

  /* ---------- Matrix widget transport (postMessage protocol) ---------- */
  var reqCount = 0;

  function toClient(msg) { window.parent.postMessage(msg, parentOrigin); }

  function request(action, data) {
    toClient({ api: 'fromWidget', widgetId: widgetId,
               requestId: 'w' + (++reqCount) + '-' + me, action: action, data: data || {} });
  }

  function sendSync(content) {
    content.sender = me;
    content.ts = Date.now();
    request('send_event', { type: EVENT_TYPE, content: content });
  }

  window.addEventListener('message', function (ev) {
    if (ev.source !== window.parent) return;
    var m = ev.data;
    if (!m || m.api !== 'toWidget' || m.widgetId !== widgetId || m.response) return;

    var reply = function (response) {
      m.response = response;
      toClient(m);
    };

    if (m.action === 'capabilities') {
      reply({ capabilities: [
        'org.matrix.msc2762.send.event:' + EVENT_TYPE,
        'org.matrix.msc2762.receive.event:' + EVENT_TYPE
      ] });
    } else if (m.action === 'notify_capabilities') {
      reply({});
      say('Connected. Paste a link to start.');
      sendSync({ kind: 'hello' });
    } else if (m.action === 'send_event') {
      reply({});
      var e = m.data;
      if (e && e.type === EVENT_TYPE && e.content && e.content.sender !== me) {
        onRemote(e.content);
      }
    } else {
      reply({});
    }
  });

  /* ---------- YouTube player ---------- */
  var player = null, playerReady = false, pending = null;
  var joined = false;
  var suppressUntil = 0;       // ignore player events we caused ourselves
  var isLeader = false;        // last client to issue a control action
  var lastT = 0, lastWall = Date.now();
  var current = { videoId: null, rate: 1 };
  var sharedPlaying = false;   // last play/pause state agreed with the room
  var lastDur = 0;             // used to spot ads (duration suddenly changes)
  var resyncTimer = null, resyncTries = 0;
  var peers = {};              // other viewers' last heartbeat
  var hold = false, holdSince = 0, readyAllSince = 0, wasReady = true, errored = false, lastHbDur = 0;

  function parseVideoId(s) {
    var m = s.match(/(?:v=|youtu\.be\/|embed\/|shorts\/|live\/)([\w-]{11})/);
    if (m) return m[1];
    return /^[\w-]{11}$/.test(s.trim()) ? s.trim() : null;
  }

  function programmatic(fn) {
    suppressUntil = Date.now() + 1500;
    fn();
  }

  function snapshot() {
    var st = playerReady ? player.getPlayerState() : -1;
    return {
      videoId: current.videoId,
      playing: st === 1 || st === 3,
      pos: playerReady ? player.getCurrentTime() : 0,
      rate: playerReady ? player.getPlaybackRate() : 1,
      dur: playerReady ? player.getDuration() : 0
    };
  }

  function broadcastState(kind) {
    var s = snapshot();
    if (!s.videoId || !isReady()) return;
    isLeader = true;
    s.kind = kind || 'state';
    sharedPlaying = s.playing;
    sendSync(s);
  }

  function applyState(s) {
    if (!playerReady) { pending = s; return; }
    if (!s.videoId) return;
    // If our video length differs from the sender's, one of us is watching an ad.
    // Ignore the message and ask again shortly instead of jumping around.
    if (s.videoId === current.videoId) {
      var myDur = player.getDuration();
      if (myDur > 0 && s.dur > 0 && Math.abs(myDur - s.dur) > 1.5) {
        if (resyncTries++ < 30) requestResync(2000);
        return;
      }
    }
    resyncTries = 0;
    hold = false; readyAllSince = 0;
    // Estimate where the sender is now, if they were playing.
    var target = s.pos;
    if (s.playing && s.recvAt) target += (Date.now() - s.recvAt) / 1000 * s.rate;

    programmatic(function () {
      if (s.videoId !== current.videoId) {
        current.videoId = s.videoId;
        errored = false;
        lastDur = 0;
        $empty.hidden = true;
        if (s.playing && joined) player.loadVideoById(s.videoId, target);
        else player.cueVideoById(s.videoId, target);
      } else {
        // Explicit play/pause/resume messages align tightly; heartbeats tolerate more drift.
        var limit = s.kind === 'state' ? 0.4 : DRIFT_LIMIT;
        if (Math.abs(player.getCurrentTime() - target) > limit) player.seekTo(target, true);
        if (player.getPlaybackRate() !== s.rate) player.setPlaybackRate(s.rate);
        var st = player.getPlayerState();
        if (s.playing && st !== 1 && st !== 3 && joined) player.playVideo();
        if (!s.playing && st === 1) player.pauseVideo();
      }
    });
    lastT = target; lastWall = Date.now();
    sharedPlaying = s.playing;
    say(s.playing ? 'Playing in sync' : 'Paused');
  }

  function onRemote(c) {
    c.recvAt = Date.now();
    if (c.kind === 'hello') {
      // Anyone who is ready and not waiting answers, staggered to limit duplicates.
      if (current.videoId && !hold && isReady()) {
        setTimeout(function () { broadcastState('state'); }, Math.random() * 800);
      }
    } else if (c.kind === 'hb') {
      c.seen = c.recvAt;
      peers[c.sender] = c;
      // The leader's heartbeat also corrects drift, but never breaks a wait.
      if (c.lead && c.playing && !hold && !isIdle()) applyState(c);
    } else if (c.kind === 'state') {
      isLeader = false;
      applyState(c);
    }
  }

  window.onYouTubeIframeAPIReady = function () {
    player = new YT.Player('player', {
      width: '100%', height: '100%',
      playerVars: { playsinline: 1, rel: 0, origin: location.origin },
      events: {
        onReady: function () {
          playerReady = true;
          if (pending) { var p = pending; pending = null; applyState(p); }
        },
        onStateChange: function (e) {
          if (hold || Date.now() < suppressUntil) return;
          // Only a real play/pause change is shared. Buffering or an ad ending
          // fires 'playing' again, and must not reset everyone.
          if (e.data === 1 && !sharedPlaying) broadcastState('state');
          else if (e.data === 2 && sharedPlaying) broadcastState('state');
        },
        onPlaybackRateChange: function () {
          if (hold || Date.now() < suppressUntil) return;
          broadcastState('state');
        },
        onError: function (e) {
          errored = true;
          say(e.data === 101 || e.data === 150
            ? 'The owner of this video blocks embedding. Try another.'
            : 'Player error ' + e.data);
        }
      }
    });
  };

  // Seek detection: a position jump the player did not explain.
  setInterval(function () {
    if (!playerReady || !current.videoId) return;
    var now = Date.now();
    var st = player.getPlayerState();
    var playing = st === 1;
    var expected = lastT + (playing ? (now - lastWall) / 1000 * player.getPlaybackRate() : 0);
    var actual = player.getCurrentTime();
    if (hold) { lastT = actual; lastWall = now; return; }
    if (now > suppressUntil && Math.abs(actual - expected) > DRIFT_LIMIT) broadcastState('state');
    lastT = actual; lastWall = now;
  }, 500);

  function requestResync(delay) {
    clearTimeout(resyncTimer);
    resyncTimer = setTimeout(function () { sendSync({ kind: 'hello' }); }, delay || 1000);
  }

  /* ---------- Lockstep: nobody plays ahead of anybody ---------- */
  var HB_MS = 6000;            // Synapse rate-limits message events, keep this slow
  var ALIVE_MS = 15000;

  function myDur() { return playerReady ? player.getDuration() : 0; }

  function alivePeers() {
    var now = Date.now(), out = [];
    Object.keys(peers).forEach(function (id) {
      var p = peers[id];
      if (now - p.seen < ALIVE_MS && !p.idle && p.videoId === current.videoId) { p.id = id; out.push(p); }
    });
    return out;
  }

  // Ads are shorter than the video, so the longest length anyone reports is the real one.
  function contentDur() {
    var m = myDur();
    alivePeers().forEach(function (p) { if (p.dur > m) m = p.dur; });
    return m;
  }

  function isIdle() { return !playerReady || !current.videoId || errored || !joined; }

  function isReady() {
    if (isIdle()) return true;
    var d = myDur();
    return d > 0 && Math.abs(d - contentDur()) <= 1.5;
  }

  function sendHb() {
    var s = snapshot();
    s.kind = 'hb';
    s.idle = isIdle();
    s.ready = isReady();
    s.hold = hold;
    s.lead = isLeader;
    sendSync(s);
  }
  setInterval(sendHb, HB_MS);

  function doResume() {
    hold = false; readyAllSince = 0; $skip.hidden = true;
    var s = snapshot();                       // our own paused position
    programmatic(function () { player.playVideo(); });
    s.playing = true; s.kind = 'state';
    sharedPlaying = true; isLeader = true;
    sendSync(s);
    lastT = s.pos; lastWall = Date.now();
    say('Playing in sync');
    sendHb();
  }

  function tick() {
    if (!playerReady) return;
    var now = Date.now();
    if (isIdle()) { hold = false; $skip.hidden = true; return; }

    // Tell the room as soon as our video length is known or changes (ad start/end).
    var d = myDur();
    if (d !== lastHbDur) { lastHbDur = d; sendHb(); }

    var st = player.getPlayerState();
    var ready = isReady();
    var others = alivePeers();
    var waiting = others.filter(function (p) { return !p.ready; }).length + (ready ? 0 : 1);
    var anyHold = others.some(function (p) { return p.hold; });

    if (ready !== wasReady) {
      wasReady = ready;
      // We just came out of an ad while the room kept playing: catch up, do not lead.
      if (ready && !hold && !anyHold) requestResync(300);
      sendHb();
    }

    if (!hold && others.length > 0 && waiting > 0 && sharedPlaying && (st === 1 || st === 3)) {
      hold = true; holdSince = now;
      sendHb();
    }

    if (!hold) { readyAllSince = 0; $skip.hidden = true; return; }

    // Holding: pause (we cannot pause an ad, so only once we are past it).
    if (ready && (st === 1 || st === 3)) programmatic(function () { player.pauseVideo(); });

    if (waiting > 0) {
      readyAllSince = 0;
      say('Waiting for ' + waiting + ' viewer' + (waiting > 1 ? 's' : '') + ' (ad or loading)\u2026');
    } else {
      if (!readyAllSince) readyAllSince = now;
      if (now - readyAllSince > 700) {
        var ids = [me];
        others.forEach(function (p) { if (p.hold) ids.push(p.id); });
        ids.sort();
        if (ids[0] === me || now - readyAllSince > 5000) doResume();
        else say('Starting together\u2026');
      }
    }
    $skip.hidden = !(now - holdSince > 8000);
  }
  setInterval(tick, 500);

  /* ---------- UI ---------- */
  $skip.addEventListener('click', function () { if (hold) doResume(); });

  document.getElementById('joinBtn').addEventListener('click', function () {
    joined = true;                 // a user gesture lets the browser allow playback
    $join.hidden = true;
    if (playerReady && current.videoId) {
      programmatic(function () { player.playVideo(); });
    }
  });

  document.getElementById('load').addEventListener('submit', function (e) {
    e.preventDefault();
    var id = parseVideoId(document.getElementById('url').value);
    if (!id) { say('That does not look like a YouTube link.'); return; }
    if (!joined) { joined = true; $join.hidden = true; }
    current.videoId = id;
    lastDur = 0;
    errored = false; hold = false;
    sharedPlaying = true;
    $empty.hidden = true;
    programmatic(function () { player.loadVideoById(id, 0); });
    lastT = 0; lastWall = Date.now();
    isLeader = true;
    sendSync({ kind: 'state', videoId: id, playing: true, pos: 0, rate: 1 });
    say('Playing for everyone');
  });

  /* ---------- Boot ---------- */
  if (!widgetId) {
    say('Open this page as a Matrix widget (widgetId missing from the URL).');
  } else {
    var tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(tag);
    request('content_loaded');
  }
})();
</script>
</body>
</html>
